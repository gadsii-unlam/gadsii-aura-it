<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Ingresar · BuffetYa!</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js" defer></script>
<style>
  .hero {
    background: var(--brand);
    color: var(--on-brand);
    padding: var(--s9) var(--s6) var(--s8);
    text-align: center;
  }
  .seal {
    width: 72px; height: 72px;
    margin: 0 auto var(--s5);
    border-radius: var(--r-pill);
    border: 2px solid rgba(255,255,255,.45);
    display: grid; place-items: center;
    font-size: var(--t-micro); font-weight: 800;
    letter-spacing: .1em; color: rgba(255,255,255,.85);
  }
  .hero h1 { font-size: var(--t-xl); letter-spacing: -.03em; }
  .hero p { margin-top: var(--s2); color: var(--on-brand-2); font-size: var(--t-sm); }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface-2);
    border-radius: var(--r-md); padding: 4px; gap: 4px;
    margin: 0 var(--s5) var(--s5);
  }
  .tabs button {
    min-height: 40px; border-radius: var(--r-sm);
    font-size: var(--t-sm); font-weight: 700; color: var(--muted);
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .tabs button:hover { color: var(--ink-2); }
  .tabs button[aria-selected="true"] {
    background: var(--surface); color: var(--ink); box-shadow: var(--lift-1);
  }
  .form { padding: 0 var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
  .foot { padding: var(--s6) var(--s5) var(--s8); text-align: center; }
</style>
</head>
<body class="is-phone">
<!-- DIRECTION CONTRACT · seed key d8c4aa79 · the category canon at full craft. -->
<div class="phone" style="background: var(--surface);">

  <header class="hero">
    <!-- REPLACE: the real UNLaM seal (white, monochrome) goes here. -->
    <div class="seal" aria-hidden="true">UNLaM</div>
    <h1>BuffetYa!</h1>
    <p>Pedí en el buffet sin hacer la fila</p>
  </header>

  <div style="height: var(--s6)"></div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true">Ingresar</button>
    <button role="tab" aria-selected="false">Crear cuenta</button>
  </div>

  <form class="form" onsubmit="return false">

    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input class="input" id="email" type="email" inputmode="email"
             autocomplete="email" placeholder="nombre@ejemplo.com" value="alumno@ejemplo.com">
    </div>

    <div class="field">
      <label class="field__label" for="pass">Contraseña</label>
      <div class="inputwrap">
        <input class="input" id="pass" type="password" autocomplete="current-password"
               placeholder="Tu contraseña" value="123" aria-invalid="true" aria-describedby="passErr">
        <button type="button" class="inputwrap__act" data-reveal="pass" aria-label="Mostrar contraseña">
          <svg><use href="#i-eye"/></svg>
        </button>
      </div>
      <!-- Errors name the problem and the recovery, never just "inválido". -->
      <p class="field__error" id="passErr">
        <svg><use href="#i-alert"/></svg>
        La contraseña tiene que tener al menos 8 caracteres.
      </p>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-top:calc(var(--s2) * -1)">
      <a class="sm" href="#" style="font-weight:600">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn btn--primary btn--block" type="submit">Ingresar</button>

    <a class="btn btn--ghost btn--block" href="menu.html">
      Entrar como invitado
    </a>

  </form>

  <div class="foot">
    <p class="cap muted" style="max-width: 32ch; margin: 0 auto;">
      Al ingresar aceptás los términos de uso del servicio de buffet de la
      Universidad Nacional de La Matanza.
    </p>
  </div>

</div>
</body>
</html>
